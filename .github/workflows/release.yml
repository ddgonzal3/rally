name: Release

# Builds a universal (Intel + Apple Silicon) Rally .app + .dmg on macOS
# and publishes a draft GitHub Release with the artifacts attached.
#
# Triggers:
#   - Pushing a tag matching `v*` (e.g. `v0.2.0`) — picks tag from ref.
#   - Manual `workflow_dispatch` — prompts for a tag name.
#
# The release is created as a DRAFT. Review and publish manually in the
# GitHub UI after verifying artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. v0.2.0)"
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: universal-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: "Rally ${{ github.event.inputs.tag_name || github.ref_name }}"
          releaseBody: "Draft release — Rally macOS (universal)."
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles app,dmg
