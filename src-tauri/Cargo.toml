[package]
name = "rally"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
test-bridge = ["tiny_http"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
regex = "1.12.3"
trash = "5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow", "NSView", "NSVisualEffectView", "NSResponder"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }
notify = "6"
tiny_http = { version = "0.12", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
