<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workbench</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; width: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(232, 185, 48, 0.4); }
        50% { opacity: 0.7; box-shadow: 0 0 6px 2px rgba(232, 185, 48, 0.3); }
      }
      .pulse-dot { animation: pulse-glow 1.5s ease-in-out infinite; }
      .file-node:hover { background: #2d2d2d !important; }
      .tab-close:hover, .tab-action:hover { background: rgba(255, 255, 255, 0.12) !important; color: #ccc !important; }
      .pane-tab:not(.pane-tab-active):hover { background: #222 !important; }
      .no-select, .no-select * { -webkit-user-select: none; user-select: none; }
      .no-select ::selection { background: transparent; }
      @keyframes claude-dot {
        0%, 80%, 100% { opacity: 0.15; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes claude-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
