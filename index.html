<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workbench</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; width: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        -webkit-font-smoothing: antialiased;
      }
      .xterm { -webkit-font-smoothing: subpixel-antialiased; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .file-node:hover { background: #2d2d2d !important; }
      .file-node-active { background: #2a2a2a !important; color: #ddd !important; }
      .tab-close { opacity: 0; }
      .tab-close-active { opacity: 1; color: #c8c8c8 !important; }
      .pane-tab:hover .tab-close { opacity: 1; }
      .tab-close:hover { background: rgba(255, 255, 255, 0.08) !important; color: #f0f0f0 !important; }
      .tab-action:hover { background: rgba(255, 255, 255, 0.12) !important; color: #ccc !important; }
      .pane-tab:not(.pane-tab-active):hover { background: #222 !important; }
      .no-select, .no-select * { -webkit-user-select: none; user-select: none; }
      .no-select ::selection { background: transparent; }
      .no-select input.rename-input { -webkit-user-select: text !important; user-select: text !important; }
      .no-select input.rename-input::selection { background: rgba(0, 122, 204, 0.4) !important; }
      .inline-edit-input, .inline-edit-input * { -webkit-user-select: text !important; user-select: text !important; }
      .inline-edit-input ::selection { background: rgba(0, 122, 204, 0.4) !important; }
      .launch-btn { cursor: pointer !important; }
      .launch-btn:hover span { color: #ddd !important; }
      .launch-btn:hover svg path { fill: #aaa !important; }
      .sidebar-item { cursor: pointer; }
      .sidebar-item:not(.sidebar-item-active):hover { background: #222 !important; }
      .sidebar-btn:hover { background: #222 !important; }
      .hover-brighten { opacity: 0.6; transition: opacity 0.15s, filter 0.15s; }
      .hover-brighten:hover { opacity: 1 !important; filter: brightness(1.5); }
      .git-status-btn { cursor: pointer; }
      .git-status-btn svg { opacity: 0.7; transition: opacity 0.15s; will-change: opacity; }
      .git-status-btn:hover svg { opacity: 1 !important; }
      .repo-action-btn { transition: color 0.12s; }
      .repo-action-btn:hover { color: #ddd !important; }
      .script-play-btn { opacity: 0 !important; transition: opacity 0.1s; }
      .file-node:hover .script-play-btn { opacity: 1 !important; }
      .change-item { cursor: pointer; }
      .change-item:not(.change-item-selected):hover { background: #2d2d2d !important; }
      .change-item .change-action-btn { display: none; transition: color 0.12s; }
      .change-item:hover .change-action-btn,
      .change-item-selected .change-action-btn { display: inline-flex; }
      .change-item .change-action-btn:hover { color: #ddd !important; }
      .changes-section-btn:hover { color: #fff !important; }
      .repo-card:hover .repo-terminal-btn { opacity: 1 !important; }
      .repo-terminal-btn:hover { background: rgba(255, 255, 255, 0.08) !important; }
      .repo-terminal-btn:hover svg path { stroke: #ddd !important; }
      .layout-preset-row:hover { background: rgba(255, 255, 255, 0.08); }
      .layout-preset-row:hover .layout-preset-delete { opacity: 1 !important; }
      .layout-preset-delete:hover { color: #ddd !important; background: rgba(255, 255, 255, 0.1); }
      .hide-native-scrollbar::-webkit-scrollbar { display: none !important; }
      .hide-native-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* Fix Monaco find widget close button — it's the only absolutely-positioned button;
         all others are flex-centered and auto-adapt. Our global border-box shrinks buttons
         from 22px to 16px, so Monaco's default top:5px is too high. */
      .monaco-editor .find-widget > .find-part,
      .monaco-editor .find-widget > .replace-part {
        margin-right: 19px !important;
      }
      .monaco-editor .find-widget > .button.codicon-widget-close {
        top: 9px !important;
      }
      .monaco-editor .find-widget .codicon-find-selection {
        display: none !important;
      }
      .activity-btn:hover { background: rgba(255, 255, 255, 0.08) !important; }
      .activity-btn-active { background: rgba(255, 255, 255, 0.068) !important; }
      .dropdown-item:hover { background: rgba(255, 255, 255, 0.08) !important; }
      @keyframes claude-dot {
        0%, 80%, 100% { opacity: 0.15; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
@keyframes panel-enter {
        from { opacity: 0; transform: translateX(6px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes panel-exit {
        from { opacity: 1; transform: none; }
        to { opacity: 0; transform: translateX(6px); }
      }
      @keyframes claude-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Chat markdown styles */
      .chat-markdown h1, .chat-markdown h2, .chat-markdown h3 { color: #fff; margin: 8px 0 4px; }
      .chat-markdown h1 { font-size: 18px; }
      .chat-markdown h2 { font-size: 16px; }
      .chat-markdown h3 { font-size: 14px; }
      .chat-markdown p { margin: 4px 0; line-height: 1.5; }
      .chat-markdown code { background: rgba(255,255,255,0.06); padding: 1px 4px; border-radius: 3px; font-size: 13px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .chat-markdown pre { background: rgba(0,0,0,0.3); border-radius: 6px; padding: 10px; overflow-x: auto; margin: 6px 0; }
      .chat-markdown pre code { background: none; padding: 0; }
      .chat-markdown ul, .chat-markdown ol { padding-left: 20px; margin: 4px 0; }
      .chat-markdown li { margin: 2px 0; line-height: 1.5; }
      .chat-markdown a { color: #88aaff; text-decoration: none; }
      .chat-markdown a:hover { text-decoration: underline; }
      .chat-markdown blockquote { border-left: 2px solid #444; padding-left: 10px; color: #bbb; margin: 6px 0; }
      .chat-markdown table { border-collapse: collapse; margin: 6px 0; }
      .chat-markdown th, .chat-markdown td { border: 1px solid #444; padding: 4px 8px; font-size: 13px; }
      .chat-markdown th { background: rgba(255,255,255,0.05); color: #fff; }
      .chat-markdown hr { border: none; border-top: 1px solid #444; margin: 8px 0; }
      .chat-markdown img { max-width: 100%; border-radius: 4px; }

      /* Streaming cursor blink */
      @keyframes blink { 50% { opacity: 0; } }

      /* Thinking dots pulse */
      @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

      /* highlight.js token colors (dark theme) */
      .hljs { color: #c9d1d9; }
      .hljs-keyword, .hljs-selector-tag, .hljs-built_in { color: #ff7b72; }
      .hljs-string, .hljs-attr { color: #a5d6ff; }
      .hljs-comment, .hljs-quote { color: #8b949e; font-style: italic; }
      .hljs-number, .hljs-literal { color: #79c0ff; }
      .hljs-title, .hljs-section { color: #d2a8ff; }
      .hljs-type, .hljs-class .hljs-title { color: #ffa657; }
      .hljs-variable, .hljs-template-variable { color: #ffa657; }
      .hljs-addition { color: #aff5b4; background: rgba(46,160,67,0.15); }
      .hljs-deletion { color: #ffdcd7; background: rgba(248,81,73,0.15); }
      .hljs-meta { color: #79c0ff; }
      .hljs-regexp { color: #a5d6ff; }
      .hljs-symbol { color: #79c0ff; }
      .hljs-attribute { color: #79c0ff; }
      .hljs-name, .hljs-tag { color: #7ee787; }
      .hljs-subst { color: #c9d1d9; }
      .hljs-function { color: #d2a8ff; }
      .hljs-params { color: #c9d1d9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
