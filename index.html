<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workbench</title>
    <script>
      (function() {
        var theme = localStorage.getItem('rally:theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      /* === Theme Variables === */
      :root,
      [data-theme="dark"] {
        --bg-app: #1a1a1a;
        --bg-surface: #161616;
        --bg-elevated: #252525;
        --bg-input: #2a2a2a;
        --bg-hover: rgba(255, 255, 255, 0.08);
        --bg-active: rgba(255, 255, 255, 0.12);
        --text-primary: #e0e0e0;
        --text-secondary: #bbb;
        --text-dim: #888;
        --border: #2a2a2a;
        --border-subtle: rgba(255, 255, 255, 0.12);
        --resize-hover: #444;
        --terminal-bg: #1a1a1a;
        --terminal-popup-bg: #1e1e1e;
        --terminal-fg: #d4d4d4;
        --terminal-cursor: #aeafad;
        --terminal-selection: #5a5a5aaa;
        --frosted-bg: rgba(36, 36, 36, 0.78);
        --scrollbar-thumb: rgba(255, 255, 255, 0.08);
        --scrollbar-thumb-hover: rgba(255, 255, 255, 0.15);
        --shadow: rgba(0, 0, 0, 0.4);
        --status-green: #3fb950;
        --status-red: #f85149;
        --status-amber: #d29922;
        --status-blue: #58a6ff;
        --tab-indicator: rgba(255, 255, 255, 0.5);
        --pill-bg: #2a2a2a;
        --drop-preview-bg: rgba(255, 255, 255, 0.04);
        --drop-preview-border: rgba(255, 255, 255, 0.08);
      }

      [data-theme="dimmed"] {
        --bg-app: #212121;
        --bg-surface: #1c1c1c;
        --bg-elevated: #282828;
        --bg-input: #313131;
        --bg-hover: rgba(255, 255, 255, 0.06);
        --bg-active: rgba(255, 255, 255, 0.10);
        --text-primary: #e0e0e0;
        --text-secondary: #bbb;
        --text-dim: #888;
        --border: #313131;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --resize-hover: #4a4a4a;
        --terminal-bg: #212121;
        --terminal-popup-bg: #252525;
        --terminal-fg: #d4d4d4;
        --terminal-cursor: #aeafad;
        --terminal-selection: #464646aa;
        --frosted-bg: rgba(38, 38, 38, 0.78);
        --scrollbar-thumb: rgba(255, 255, 255, 0.06);
        --scrollbar-thumb-hover: rgba(255, 255, 255, 0.12);
        --shadow: rgba(0, 0, 0, 0.3);
        --status-green: #3fb950;
        --status-red: #f85149;
        --status-amber: #d29922;
        --status-blue: #58a6ff;
        --tab-indicator: rgba(255, 255, 255, 0.5);
        --pill-bg: #2d2d2d;
        --drop-preview-bg: rgba(255, 255, 255, 0.04);
        --drop-preview-border: rgba(255, 255, 255, 0.08);
      }

      [data-theme="light"] {
        --bg-app: #c8c8c8;
        --bg-surface: #bfbfbf;
        --bg-elevated: #e0e0e0;
        --bg-input: #bbb;
        --bg-hover: rgba(0, 0, 0, 0.08);
        --bg-active: rgba(0, 0, 0, 0.12);
        --text-primary: #111;
        --text-secondary: #3a3a3a;
        --text-dim: #666;
        --border: #aaa;
        --border-subtle: rgba(0, 0, 0, 0.12);
        --resize-hover: #888;
        --terminal-bg: #c8c8c8;
        --terminal-popup-bg: #c2c2c2;
        --terminal-fg: #111;
        --terminal-cursor: #333;
        --terminal-selection: #8ab4d8aa;
        --frosted-bg: rgba(190, 190, 190, 0.82);
        --scrollbar-thumb: rgba(0, 0, 0, 0.18);
        --scrollbar-thumb-hover: rgba(0, 0, 0, 0.30);
        --shadow: rgba(0, 0, 0, 0.22);
        --status-green: #1a7f37;
        --status-red: #cf222e;
        --status-amber: #9a6700;
        --status-blue: #0969da;
        --tab-indicator: rgba(0, 0, 0, 0.35);
        --pill-bg: #b3b3b3;
        --drop-preview-bg: rgba(0, 0, 0, 0.04);
        --drop-preview-border: rgba(0, 0, 0, 0.08);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      ::placeholder { color: var(--text-dim); opacity: 1; }
      html, body, #root { height: 100%; width: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg-app);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }
      .xterm { -webkit-font-smoothing: subpixel-antialiased; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .file-node { contain: inline-size style; }
      .file-node:hover { background: var(--bg-elevated) !important; }
      .file-node-active { background: var(--bg-input) !important; color: var(--text-primary) !important; }
      .tab-close { opacity: 0; }
      .tab-close-active { opacity: 1; color: var(--text-secondary) !important; }
      .pane-tab:hover .tab-close { opacity: 1; }
      .tab-close:hover { background: var(--bg-hover) !important; color: var(--text-primary) !important; }
      .tab-action:hover { background: var(--bg-active) !important; color: var(--text-secondary) !important; }
      .pane-tab:not(.pane-tab-active):hover { background: var(--bg-hover) !important; }
      .pane-tab-active { position: relative; }
      .no-select, .no-select * { -webkit-user-select: none; user-select: none; }
      .no-select ::selection { background: transparent; }
      .no-select input.rename-input { -webkit-user-select: text !important; user-select: text !important; }
      .no-select input.rename-input::selection { background: rgba(0, 122, 204, 0.4) !important; }
      .inline-edit-input, .inline-edit-input * { -webkit-user-select: text !important; user-select: text !important; }
      .inline-edit-input ::selection { background: rgba(0, 122, 204, 0.4) !important; }
      .launch-btn { cursor: pointer !important; }
      .launch-btn:hover span { color: var(--text-primary) !important; }
      .launch-btn:hover svg path { fill: var(--text-secondary) !important; }
      .sidebar-item { cursor: pointer; }
      .sidebar-item:not(.sidebar-item-active):hover { background: var(--bg-hover) !important; }
      .sidebar-btn:hover { background: var(--bg-hover) !important; }
      .hover-brighten { opacity: 0.6; transition: opacity 0.15s, filter 0.15s; }
      .hover-brighten:hover { opacity: 1 !important; filter: brightness(1.5); }
      .git-status-btn { cursor: pointer; }
      .git-status-btn svg { opacity: 0.7; transition: opacity 0.15s; will-change: opacity; }
      .git-status-btn:hover svg { opacity: 1 !important; }
      .repo-action-btn { transition: color 0.12s; }
      .repo-action-btn:hover { color: var(--text-primary) !important; }
      .script-play-btn { opacity: 0 !important; transition: opacity 0.1s; }
      .file-node:hover .script-play-btn { opacity: 1 !important; }
      .change-item { cursor: pointer; }
      .change-item:not(.change-item-selected):hover { background: var(--bg-elevated) !important; }
      .change-item .change-action-btn { display: none; transition: color 0.12s; }
      .change-item:hover .change-action-btn,
      .change-item-selected .change-action-btn { display: inline-flex; }
      .change-item .change-action-btn:hover { color: var(--text-primary) !important; }
      .changes-section-btn:hover { color: var(--text-primary) !important; }
      .repo-card:hover .repo-terminal-btn { opacity: 1 !important; }
      .repo-terminal-btn:hover { background: var(--bg-hover) !important; }
      .repo-terminal-btn:hover svg path { stroke: var(--text-primary) !important; }
      .layout-preset-row:hover { background: var(--bg-hover); }
      .layout-preset-row:hover .layout-preset-delete,
      .layout-preset-row:hover .layout-preset-handle { opacity: 1 !important; }
      .layout-preset-delete:hover { color: var(--text-primary) !important; background: rgba(255,255,255,0.1) !important; border-radius: 4px; }
      .hide-native-scrollbar::-webkit-scrollbar { display: none !important; }
      .hide-native-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* Fix Monaco find widget close button — it's the only absolutely-positioned button;
         all others are flex-centered and auto-adapt. Our global border-box shrinks buttons
         from 22px to 16px, so Monaco's default top:5px is too high. */
      .monaco-editor .find-widget > .find-part,
      .monaco-editor .find-widget > .replace-part {
        margin-right: 19px !important;
      }
      .monaco-editor .find-widget > .button.codicon-widget-close {
        top: 9px !important;
      }
      .monaco-editor .find-widget .codicon-find-selection {
        display: none !important;
      }
      .activity-btn:hover { background: var(--bg-hover) !important; }
      .activity-btn-active { background: var(--bg-hover) !important; }
      .dropdown-item:hover { background: var(--bg-hover) !important; }
      @keyframes claude-dot {
        0%, 80%, 100% { opacity: 0.15; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
@keyframes panel-enter {
        from { opacity: 0; transform: translateX(6px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes panel-exit {
        from { opacity: 1; transform: none; }
        to { opacity: 0; transform: translateX(6px); }
      }
      @keyframes claude-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pulse-glow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      @keyframes pulse-sync-kf {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      @keyframes success-flash {
        0% { background: var(--status-green); opacity: 1; }
        70% { background: var(--status-green); opacity: 0.8; }
        100% { background: var(--text-dim); opacity: 0.6; }
      }

      @keyframes success-flash-watcher {
        0% { background: var(--status-green); opacity: 1; }
        70% { background: var(--status-green); opacity: 0.8; }
        100% { background: var(--status-green); opacity: 0.4; }
      }

      .status-bar-slot:hover { background: var(--bg-hover); }
      .status-bar-tab:hover { background: var(--bg-hover); }

      /* During split-drag, disable pointer events on iframes to prevent
         hover/cursor recalc inside embedded content. */
      [data-rally-split-drag] iframe {
        pointer-events: none !important;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
